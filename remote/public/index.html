<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="remote">
      <!-- Mote character -->
      <div class="mote" id="mote">
        <div class="mote-antenna">
          <div class="mote-antenna-ball"></div>
          <div class="mote-antenna-stick"></div>
        </div>
        <div class="mote-body">
          <div class="mote-face">
            <div class="mote-eye left"></div>
            <div class="mote-eye right"></div>
            <div class="mote-mouth" id="mote-mouth"></div>
          </div>
        </div>
      </div>

      <div class="mote-speech" id="mote-speech">Hi! I'm Mote!</div>

      <!-- Status dot -->
      <div class="status" id="status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">connecting...</span>
      </div>

      <!-- D-Pad in circular ring -->
      <div class="dpad-ring">
        <div class="dpad">
          <button class="dpad-btn up" data-action="up" aria-label="Up">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
          </button>
          <button class="dpad-btn left" data-action="left" aria-label="Left">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button class="dpad-btn center" data-action="ok" aria-label="OK">OK</button>
          <button class="dpad-btn right" data-action="right" aria-label="Right">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button class="dpad-btn down" data-action="down" aria-label="Down">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Action buttons -->
      <div class="actions">
        <button class="action-btn back" data-action="back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
          <span>Back</span>
        </button>
        <button class="action-btn home" data-action="home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
          <span>Home</span>
        </button>
        <button class="action-btn reload" data-action="reload">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
          <span>Reload</span>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Volume controls -->
      <div class="volume">
        <button class="volume-btn" data-volume="down" aria-label="Volume Down">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/></svg>
        </button>
        <button class="volume-btn mute" data-volume="mute" aria-label="Mute">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><line x1="22" x2="16" y1="9" y2="15"/><line x1="16" x2="22" y1="9" y2="15"/></svg>
        </button>
        <button class="volume-btn" data-volume="up" aria-label="Volume Up">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"/><path d="M16 9a5 5 0 0 1 0 6"/><path d="M19.364 18.364a9 9 0 0 0 0-12.728"/></svg>
        </button>
      </div>

      <!-- Keyboard toggle -->
      <button class="keyboard-toggle" id="btn-keyboard" type="button">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg>
        <span>Keyboard</span>
      </button>
      <input
        type="text"
        class="keyboard-input"
        id="keyboard-input"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="Live keyboard input"
      />

      <!-- Keyboard hint -->
      <div class="hint">
        arrows = navigate, enter = OK, esc = back, h = home, r = reload, +/- = vol, m = mute
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
