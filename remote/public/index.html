<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Mote</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="remote">
      <!-- Mote character -->
      <div class="mote" id="mote">
        <div class="mote-antenna">
          <div class="mote-antenna-ball"></div>
          <div class="mote-antenna-stick"></div>
        </div>
        <div class="mote-body">
          <div class="mote-face">
            <div class="mote-eye left"></div>
            <div class="mote-eye right"></div>
            <div class="mote-mouth" id="mote-mouth"></div>
          </div>
        </div>
      </div>

      <div class="mote-speech" id="mote-speech">Hi! I'm Mote!</div>

      <!-- Status dot -->
      <div class="status" id="status">
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">connecting...</span>
      </div>

      <!-- D-Pad -->
      <div class="dpad">
        <button class="dpad-btn up" data-action="up" aria-label="Up">
          <svg viewBox="0 0 24 24"><path d="M12 6l-8 8h16z"/></svg>
        </button>
        <button class="dpad-btn left" data-action="left" aria-label="Left">
          <svg viewBox="0 0 24 24"><path d="M6 12l8-8v16z"/></svg>
        </button>
        <button class="dpad-btn center" data-action="ok" aria-label="OK">OK</button>
        <button class="dpad-btn right" data-action="right" aria-label="Right">
          <svg viewBox="0 0 24 24"><path d="M18 12l-8-8v16z"/></svg>
        </button>
        <button class="dpad-btn down" data-action="down" aria-label="Down">
          <svg viewBox="0 0 24 24"><path d="M12 18l8-8H4z"/></svg>
        </button>
      </div>

      <!-- Action buttons -->
      <div class="actions">
        <button class="action-btn back" data-action="back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
          <span>Back</span>
        </button>
        <button class="action-btn home" data-action="home">
          <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
          <span>Home</span>
        </button>
        <button class="action-btn reload" data-action="reload">
          <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2.5a5.5 5.5 0 11-1.32-3.58L14 10.5h6V4.5l-2.35 1.85z"/></svg>
          <span>Reload</span>
        </button>
      </div>

      <!-- Volume controls -->
      <div class="volume">
        <button class="volume-btn" data-volume="down" aria-label="Volume Down">
          <svg viewBox="0 0 24 24"><path d="M18.5 12A4.5 4.5 0 0016 7.97v8.05A4.48 4.48 0 0018.5 12zM5 9v6h4l5 5V4L9 9H5z"/></svg>
        </button>
        <button class="volume-btn mute" data-volume="mute" aria-label="Mute">
          <svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0021 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>
        <button class="volume-btn" data-volume="up" aria-label="Volume Up">
          <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-3.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
      </div>

      <!-- Text input -->
      <div class="text-section">
        <input
          type="text"
          class="text-input"
          id="text-input"
          placeholder="Type here, Mote will send it!"
          maxlength="500"
          autocomplete="off"
          enterkeyhint="send"
        />
        <div class="text-buttons">
          <button class="text-btn send" id="btn-send">Send Text</button>
          <button class="text-btn send-enter" id="btn-send-enter">Send + Enter</button>
        </div>
      </div>

      <!-- Keyboard hint -->
      <div class="hint">
        Keyboard: arrows = navigate, enter = OK, esc = back, h = home, r = reload, +/- = volume, m = mute
      </div>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
