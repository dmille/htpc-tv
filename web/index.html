<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TV Home</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="clock" id="clock"></div>

      <section class="grid" aria-label="Apps">
        <a class="tile" href="http://titan.local:8096/web/index.html#!/home.html?tv=1" data-app="jellyfin">
          <div class="tile-icon">
            <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="jf-grad" gradientUnits="userSpaceOnUse" x1="110.25" y1="213.3" x2="496.14" y2="436.09">
                  <stop offset="0" style="stop-color:#AA5CC3"/>
                  <stop offset="1" style="stop-color:#00A4DC"/>
                </linearGradient>
              </defs>
              <path d="M256,201.6c-20.4,0-86.2,119.3-76.2,139.4s142.5,19.9,152.4,0S276.5,201.6,256,201.6z" fill="url(#jf-grad)"/>
              <path d="M256,23.3c-61.6,0-259.8,359.4-229.6,420.1s429.3,60,459.2,0S317.6,23.3,256,23.3z M406.5,390.8c-19.6,39.3-281.1,39.8-300.9,0s110.1-275.3,150.4-275.3S426.1,351.4,406.5,390.8z" fill="url(#jf-grad)"/>
            </svg>
          </div>
          <span class="tile-label">Jellyfin</span>
        </a>

        <a class="tile" href="https://www.youtube.com/tv" data-app="youtube">
          <div class="tile-icon">
            <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="56" y="116" width="400" height="280" rx="60" fill="#FF0000"/>
              <path d="M212 192v128l112-64-112-64z" fill="#fff"/>
            </svg>
          </div>
          <span class="tile-label">YouTube</span>
        </a>

        <a class="tile" href="http://localhost:8881" data-app="fetch">
          <div class="tile-icon">
            <svg viewBox="0 -1 24 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <!-- Lucide dog face -->
              <path d="M11.25 16.25h1.5L12 17z" stroke="#6c8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M16 14v.5" stroke="#6c8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M4.42 11.247A13.152 13.152 0 0 0 4 14.556C4 18.728 7.582 21 12 21s8-2.272 8-6.444a11.702 11.702 0 0 0-.493-3.309" stroke="#6c8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8 14v.5" stroke="#6c8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M8.5 8.5c-.384 1.05-1.083 2.028-2.344 2.5-1.931.722-3.576-.297-3.656-1-.113-.994 1.177-6.53 4-7 1.923-.321 3.651.845 3.651 2.235A7.497 7.497 0 0 1 14 5.277c0-1.39 1.844-2.598 3.767-2.277 2.823.47 4.113 6.006 4 7-.08.703-1.725 1.722-3.656 1-1.261-.472-1.855-1.45-2.239-2.5" stroke="#6c8cff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <!-- Bone (in mouth area, tilted) -->
              <g transform="translate(12, 19.5) rotate(-20)">
                <rect x="-5.5" y="-1.25" width="11" height="2.5" rx="1.25" fill="#f0f0f5" opacity="0.8"/>
                <circle cx="-5.5" cy="-1.5" r="1.5" fill="#f0f0f5" opacity="0.8"/>
                <circle cx="-5.5" cy="1.5" r="1.5" fill="#f0f0f5" opacity="0.8"/>
                <circle cx="5.5" cy="-1.5" r="1.5" fill="#f0f0f5" opacity="0.8"/>
                <circle cx="5.5" cy="1.5" r="1.5" fill="#f0f0f5" opacity="0.8"/>
              </g>
            </svg>
          </div>
          <span class="tile-label">Fetch</span>
        </a>

        <a class="tile" href="https://www.netflix.com/tv" data-app="netflix">
          <div class="tile-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="m5.398 0 8.348 23.602c2.346.059 4.856.398 4.856.398L10.113 0H5.398zm8.489 0v9.172l4.715 13.33V0h-4.715zM5.398 1.5V24c1.873-.225 2.81-.312 4.715-.398V14.83L5.398 1.5z" fill="#E50914"/>
            </svg>
          </div>
          <span class="tile-label">Netflix</span>
        </a>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
